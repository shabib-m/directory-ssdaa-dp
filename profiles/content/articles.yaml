- type: "article"
  title: "مشروع القدية"
  status: 1
  body: "<p><span>القِدّيَّة مشروع ترفيهي رياضي ثقافي سعودي أعلن عنه ولي العهد السعودي رئيس مجلس إدارة صندوق الاستثمارات العامة في 7 أبريل 2017 كوجهة ترفيهية واجتماعية نوعية، ووضع حجر الأساس للمشروع خادم الحرمين الشريفين الملك سلمان بن عبد العزيز آل سعود في يوم 28 أبريل 2018 الموافق 12 شعبان 1439 هـ</span></p>"
  format: "full_html"
  category_child: "الصحف السعوديه" # لربط المقال بقسم الصحف السعودية كمثال
  site_image: "six-flags-2-dsktp.png"

- type: "article"
  title: "مشروع نيوم"
  status: 1
  body: "<p><span>نيوم هو مشروع سعودي لمدينة مخطط لبنائها عابرة للحدود، أطلقه الأمير محمد بن سلمان آل سعود، ولي العهد السعودي في يوم الثلاثاء 4 صفر 1439 هـ الموافق 24 أكتوبر 2017 ويقع المشروع في أقصى شمال غرب المملكة العربية السعودية بـإمارة منطقة تبوك محافظة ضباء، ويمتد 460 كم على ساحل البحر الأحمر.</span></p>"
  format: "full_html"
  category_child: "الصحف السعوديه"
